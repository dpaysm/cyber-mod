[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter"
version = "0.1.0"
description = "HUNTER - AI-powered interactive web security testing copilot (TUI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.86",
    "mitmproxy>=10.2",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hunter = "hunter.cli:main"
avci = "hunter.cli:main"  # legacy alias — old setups keep working

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
